name: MySQL ORM Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-mysql:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password 
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies for mysqlclient
      run: |
        sudo apt-get update
        sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest mysqlclient

    - name: Run MySQL Tests
      env:
        MYSQL_HOST: 127.0.0.1 
        MYSQL_PORT: 3306
        MYSQL_USER: root
        MYSQL_PASSWORD: password 
        MYSQL_DB_NAME: test_orm_db
      run: |
        pytest tests/MySQL_Op.py tests/Mysql_test.py -v