name: Update AI Reference Files

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Ormophine/Sqlite/**/*.py'
      - 'Ormophine/Mysql/**/*.py'
      - 'Ormophine/Postgresql/**/*.py'
      - 'scripts/update_ai_references.py'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Ormophine/Sqlite/**/*.py'
      - 'Ormophine/Mysql/**/*.py'
      - 'Ormophine/Postgresql/**/*.py'
      - 'scripts/update_ai_references.py'

jobs:
  update-references:
    runs-on: ubuntu-latest
    permissions:
      contents: write  

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'  

    - name: Run update script
      run: python scripts/update_ai_references.py

    - name: Commit and push if changed
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🔄 Update AI Reference files with latest Python code"
        file_pattern: "Ormophine/*.AI.Refrence.txt"